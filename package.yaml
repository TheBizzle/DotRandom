name:        dotrandom
version:     1.0
category:    CLI
stability:   Experimental
build-type:  Simple

language: GHC2024

default-extensions:
  - OverloadedRecordDot
  - OverloadedStrings

dependencies:
  - bizzlelude >= 4.20.2.0.4 && < 4.21.0

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-import-lists
  - -Wredundant-constraints
  - -fno-warn-name-shadowing
  - -funbox-strict-fields
  - -O2

executables:
  dotrandom:
    source-dirs: app
    main:        Main.hs
    dependencies:
      - containers
      - dotrandom
      - random >= 1.2 && < 1.3
      - text

library:
  source-dirs: src/main
  exposed-modules:
    - Dotrandom.Banlist
    - Dotrandom.Hero
    - Dotrandom.InternalName
    - Dotrandom.Positions
    - Dotrandom.Team
  dependencies:
    - containers >= 0.7 && < 0.8
    - text       >= 2.1 && < 2.2
